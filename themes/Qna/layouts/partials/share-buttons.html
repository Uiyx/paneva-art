{{/* Share buttons: copy link, Facebook, Messenger, Instagram (+ native share on mobile).
     Expects the current page context (uses .Permalink and .Title). */}}
{{ $url := .Permalink }}
{{ $title := .Title }}
<div class="share-buttons mt-4" data-share-url="{{ $url }}" data-share-title="{{ $title }}">
  <span class="share-label text-muted">Сподели:</span>

  <button type="button" class="share-btn share-copy" aria-label="Копирай линка">
    <i class="bi bi-link-45deg" aria-hidden="true"></i><span>Копирай линк</span>
  </button>

  <button type="button" class="share-btn share-facebook" aria-label="Сподели във Facebook">
    <i class="bi bi-facebook" aria-hidden="true"></i><span>Facebook</span>
  </button>

  <button type="button" class="share-btn share-native" aria-label="Сподели чрез устройството" hidden>
    <i class="bi bi-share" aria-hidden="true"></i><span>Сподели</span>
  </button>

  <span class="share-status" role="status" aria-live="polite"></span>
</div>

<script>
(function () {
  /* Bind ALL .share-buttons containers (the partial is used inside loops,
     e.g. post-card.html in masonry grids, plus once on single pages). */
  if (window.__shareButtonsInit) return;

  function init() {
    if (window.__shareButtonsInit) return;
    window.__shareButtonsInit = true;

    var containers = document.querySelectorAll('.share-buttons');
    if (!containers.length) return;

    containers.forEach(function (container) {
      var url = container.getAttribute('data-share-url');
      var title = container.getAttribute('data-share-title');
      var status = container.querySelector('.share-status');
      var statusTimer = null;

      function showStatus(text) {
        status.textContent = text;
        status.classList.add('share-status--visible');
        clearTimeout(statusTimer);
        statusTimer = setTimeout(function () {
          status.classList.remove('share-status--visible');
        }, 2500);
      }

      function copyLink(done) {
        function fallback() {
          var input = document.createElement('input');
          input.value = url;
          input.setAttribute('readonly', '');
          input.style.position = 'absolute';
          input.style.left = '-9999px';
          document.body.appendChild(input);
          input.select();
          input.setSelectionRange(0, input.value.length);
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(input);
          done(ok);
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
        } else {
          fallback();
        }
      }

      var canNativeShare = typeof navigator.share === 'function';
      var nativeBtn = container.querySelector('.share-native');
      if (canNativeShare) {
        nativeBtn.hidden = false;
        nativeBtn.addEventListener('click', function () {
          navigator.share({ title: title, url: url }).catch(function () { /* user cancelled */ });
        });
      }

      container.querySelector('.share-copy').addEventListener('click', function () {
        copyLink(function (ok) {
          showStatus(ok ? 'Линкът е копиран!' : 'Копирайте линка от адресната лента');
        });
      });

      container.querySelector('.share-facebook').addEventListener('click', function () {
        var shareUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
        window.open(shareUrl, 'facebook-share', 'width=600,height=540,menubar=no,toolbar=no');
      });
    });
  }

  /* Defer until the whole DOM is in place so every card's buttons exist. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
