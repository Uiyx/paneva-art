licenselink = "https://github.com/ololiuhqui/magnolia-free-hugo-theme/blob/main/LICENSE.md"
description = "A simple, completely customizable, multilingual Hugo theme thought for professionals and small businesses."

# The home page of the theme, where the source can be found.
