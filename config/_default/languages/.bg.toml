 [params.biography]
   title = "Творческа Биография"
description = """
## Награди и отличия

- **2025** | Почетна значка на град Пловдив – за принос в издигането на духовния и културен облик на града и популяризирането на българската култура.
- **2025** | Първа награда – Национален конкурс за стипендия на галерия „Ромфея", Пловдив.
- **2025** | Трета награда – Национална изложба-конкурс с международно участие, Благоевград.
- **2025** | Номинация за „Млад автор" – Годишна изложба на Дружество на пловдивските художници (ДПХ).
- **2024** | Поощрителна награда – Конкурс за рисунка на името на арх. Георги Савов.
- **2023** | Първа награда – Конкурс за рисунка на името на арх. Георги Савов.

## Самостоятелни изложби

- **2025** | Самостоятелна изложба – БНР Пловдив
- **2024** | Самостоятелна изложба – Галерия „Крис", Асеновград
- **2023** | Самостоятелна изложба – БНР Пловдив

## Избрани участия и проекти

- **2026** | Майсторски клас по живопис при доц. Йордан Йорданов и Янко Янев – Раювци
- **2025** | Международно триенале „Духът на акварела" – ГХГ Варна
- **2025** | Международен младежки фестивал на акварела – Пловдив
- **2025** | „Emergence Art Fest" – Варна
- **2025** | Годишна изложба на АМТИИ „Проф. Асен Диамандиев"
- **2024** | Международен фестивал „Творците"
- **2024** | Изложба „Музиката има цвят и цветовете звуци"
- **2024** | Благотворителен търг на Камарата на строителите в Пловдив
- **2023** | Благотворителен търг на „Gentlemen's Club Philippopolis"
- **2023** | Участие в конкурс на галерия „Ромфея"
"""

