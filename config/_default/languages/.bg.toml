    ###
    preTitle = ''
    title = "За Мен"
    # You can use some markdown safely here as long as you don't include line breaks
    intro= """
Казвам се **Яна Панева** и съм художник, роден и израснал в един от най-артистичните градове – Пловдив. Изкуството за мен никога не е било просто хоби, а начин да изразявам света около себе си.
Пътят ми като професионален артист започна в Националната художествена гимназия „Цанко Лавренов“. Там преминах през школата на графиката и скулптурата, което обогати погледа ми за форма и обем, но голямата ми любов си остана живописта.
През 2025 г. завърших със специалност „Изящни изкуства“, а в момента продължавам академичното си развитие в АМТИИ „Проф. Асен Диамандиев“ – Пловдив. Днес творбите ми са резултат от това непрекъснато търсене на хармония и цвят.“
        """
    mainButton = "Картини"
    mainButtonRef = "art" # Just write the name or slug of the page here
    secondButton = "Свържи се с мен"
    secondButtonRef = "contacts" # Just write the name or slug of the page here
